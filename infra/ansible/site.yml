---
- name: Configure CI server (Jenkins, Docker, Maven, kubectl, Trivy)
  hosts: ci
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - openjdk-17-jdk
          - maven
          - git
          - docker.io
          - unzip
          - curl
          - ca-certificates
          - gnupg
          - fontconfig
        state: present

    - name: Add Jenkins apt signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add Jenkins apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc]
          https://pkg.jenkins.io/debian-stable binary/
        filename: jenkins
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        update_cache: true
        state: present

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Let the jenkins user run Docker
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Restart Jenkins so the new group applies
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: restarted

    - name: Kernel settings required by SonarQube
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        content: |
          vm.max_map_count=262144
          fs.file-max=65536
        mode: "0644"

    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Create 2 GB swap file
      ansible.builtin.shell: |
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Install kubectl (latest stable)
      ansible.builtin.shell: |
        KVER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
        curl -fsSL -o /usr/local/bin/kubectl \
        https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl
        chmod 0755 /usr/local/bin/kubectl
      args:
        creates: /usr/local/bin/kubectl

    - name: Install Trivy
      ansible.builtin.shell: >
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
        | sh -s -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/trivy

    - name: Wait for Jenkins to create the first-run password
      ansible.builtin.wait_for:
        path: /var/lib/jenkins/secrets/initialAdminPassword
        timeout: 300

    - name: Read the Jenkins initial admin password
      ansible.builtin.command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_pw
      changed_when: false

    - name: Show the Jenkins initial admin password
      ansible.builtin.debug:
        msg: "Jenkins initial admin password: {{ jenkins_pw.stdout }}"

- name: Configure Kubernetes server (k3s)
  hosts: k8s
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install k3s single-node cluster
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_EXEC="--write-kubeconfig-mode 644
        --tls-san {{ ansible_host }}
        --tls-san {{ ansible_default_ipv4.address }}" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait until the node is Ready
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    - name: Download kubeconfig to your laptop
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./k3s.yaml
        flat: true
